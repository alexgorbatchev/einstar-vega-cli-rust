name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore Rust toolchain
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-${{ runner.os }}-${{ runner.arch }}-1.98.1-clippy-rustfmt-llvm-v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools-preview

      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ubuntu-24.04-llvm-cov-0.9.1-just-1.59.0-actionlint-1.7.12

      - name: Install check tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: just@1.59.0,cargo-llvm-cov@0.9.1
          fallback: none

      - name: Install actionlint
        run: |
          archive_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          trap 'rm -rf "$archive_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive_dir/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' \
            "$archive_dir/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$archive_dir/actionlint.tar.gz" -C "$CARGO_HOME/bin" actionlint

      - name: Validate workflows
        run: actionlint

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check both workspace packages
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          just check
          git diff --exit-code -- Cargo.lock
