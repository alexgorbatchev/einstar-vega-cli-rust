[package]
name = "einstar-vega-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Browse and download Einstar Vega scanner projects"

[[bin]]
name = "vega-cli"
path = "src/main.rs"

[dependencies]
einstar-vega = { path = "crates/einstar-vega" }
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
clap = { version = "4.6", features = ["env", "string"] }
clap_complete = "4.6"
crossterm = "0.29"
ratatui = "0.30.2"
axum = "0.8"
cbor4ii = { version = "1.2", features = ["serde1", "use_std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.20", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["term", "fs", "poll"] }

[workspace]
members = [".","crates/einstar-vega"]
default-members = [".","crates/einstar-vega"]
resolver = "3"
