[package]
name = "einstar-vega"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Read-only Einstar Vega protocol, project trees, and atomic downloads"

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
cbor4ii = { version = "1.2", features = ["serde1", "use_std", "half-f16"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["try_close"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"

